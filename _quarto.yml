project:
  type: website
  output-dir: _site
  # Render everything except the blog (kept in the repo, not published for now).
  # To bring the blog back, remove these render rules.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!blog/**"

website:
  title: "Laura Burnett"
  description: "Research data scientist working across neuroscience, data pipelines and open research resources."
  # Required for absolute og:image / canonical URLs — social scrapers reject
  # relative image paths, so link previews stay blank without this.
  site-url: "https://leburnett.github.io"
  search: false

  # Default social preview image for every page. Pages that set their own
  # `image:` in frontmatter (e.g. project cards) override this automatically.
  image: "/assets/social-card.png"

  # Google Analytics. Quarto injects the gtag snippet into every page it builds,
  # so nothing needs adding to individual .qmd files — despite what Google's
  # own setup instructions say (those assume hand-written HTML).
  #
  # `storage: none` runs GA in cookieless mode and `anonymize-ip` truncates
  # visitor IPs, so no individual is identified and no consent banner is legally
  # required for UK/EU visitors. The trade-off is that returning visitors can't
  # be recognised, so every visit counts as a new user — treat the user and
  # session totals as inflated. Page views and referrers remain accurate.
  #
  # Switching `storage` back to `cookies` gives accurate user counts but then a
  # consent banner IS required; add `cookie-consent: {type: express}` alongside.
  google-analytics:
    tracking-id: "G-G40VL43XQE"
    storage: none
    anonymize-ip: true

  sidebar:
    style: docked
    background: transparent
    contents:
      - text: "Projects"
        href: projects/index.qmd
      - text: "CV"
        href: experience.qmd
      - text: "About Me"
        href: about.qmd
      - text: "---"
      - icon: github
        text: "GitHub"
        href: https://github.com/leburnett
      - icon: mortarboard-fill
        text: "Scholar"
        href: https://scholar.google.com/citations?user=oPPRKuIAAAAJ&hl=en&oi=ao
      - icon: linkedin
        text: "LinkedIn"
        href: https://www.linkedin.com/in/laura-burnett-265a16247/
      - icon: envelope
        text: "Email"
        href: mailto:leburnett3@gmail.com
      - icon: file-earmark-arrow-down
        text: "Download CV"
        href: assets/cv.pdf
        target: "_blank"

  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      dark: [darkly, custom-dark.scss]
      light: [journal, custom.scss]
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: _tooltips.html
    # Click any figure to open it full-size.
    lightbox: auto
