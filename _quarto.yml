project:
  type: website
  output-dir: _site
  # Render everything except the blog (kept in the repo, not published for now).
  # To bring the blog back, remove these render rules.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!blog/**"

website:
  title: "Laura Burnett"
  description: "Personal research portfolio."
  search: false

  sidebar:
    style: docked
    background: transparent
    contents:
      - text: "Projects"
        href: projects/index.qmd
      - text: "Experience & Skills"
        href: experience.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "About Me"
        href: about.qmd
      - text: "---"
      - icon: github
        text: "GitHub"
        href: https://github.com/leburnett
      - icon: mortarboard-fill
        text: "Scholar"
        href: https://scholar.google.com/citations?user=oPPRKuIAAAAJ&hl=en&oi=ao
      - icon: linkedin
        text: "LinkedIn"
        href: https://www.linkedin.com/in/laura-burnett-265a16247/
      - icon: envelope
        text: "Email"
        href: mailto:leburnett3@gmail.com
      - icon: file-earmark-arrow-down
        text: "Download CV"
        href: assets/cv.pdf
        target: "_blank"

  open-graph: true

format:
  html:
    theme:
      dark: [darkly, custom-dark.scss]
      light: [journal, custom.scss]
    toc: false
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body: _tooltips.html
