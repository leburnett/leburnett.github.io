project:
  type: website
  output-dir: _site
  # The blog renders only the posts that are ready. Posts 06, 07 and 09 are drafts:
  # remove their exclusions below as each one is published.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "blog/posts/*.md"
    - "!blog/posts/welcome/**"
    - "!blog/posts/06_*.md"
    - "!blog/posts/07_*.md"
    - "!blog/posts/09_*.md"

website:
  title: "Laura Burnett"
  description: "Research data scientist working across neuroscience, data pipelines and open research resources."
  # Required for absolute og:image / canonical URLs — social scrapers reject
  # relative image paths, so link previews stay blank without this.
  site-url: "https://leburnett.github.io"
  search: false

  # Default social preview image for every page. Pages that set their own
  # `image:` in frontmatter (e.g. project cards) override this automatically.
  image: "/assets/social-card.png"

  # Top navbar replaces the old left sidebar. The site title ("Laura
  # Burnett") is rendered on the left automatically from `website.title`
  # above; only the right-hand links need listing here. The social/CV icon
  # links live in the hero (index.qmd) and in the fixed footer bar
  # (_site-footer.html) instead of the nav.
  # CV and About scroll to their sections on the homepage, which now carry
  # the full content (index.qmd includes the same _cv-body/_about-body
  # partials the standalone pages use). Projects keeps its own page, since
  # the homepage only shows the three most recent.
  navbar:
    background: transparent
    # Stay visible while scrolling. Without this Quarto's headroom.js hides
    # the navbar on the way down and only brings it back on the way up.
    pinned: true
    right:
      - text: "Projects"
        href: projects/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "CV"
        href: "/#cv"
      - text: "About"
        href: "/#about"

  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      dark: [darkly, custom-dark.scss]
      light: [journal, custom.scss]
    # Off by default. The longer project pages switch it on with `toc: true` in
    # their own frontmatter; these two settings sit here so the placement and
    # heading stay consistent wherever it is enabled.
    toc: false
    toc-location: right
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    # _project-nav.html is generated by scripts/build-project-nav.py — rerun it
    # after adding a project or changing a `priority`.
    include-after-body:
      - _analytics.html
      - _project-nav.html
      - _site-footer.html
    # Click any figure to open it full-size.
    lightbox: auto

# Figure numbers come from `#fig-` labels rather than being typed into the
# caption text. `title-delim` keeps the existing "Figure 1." style rather than
# Quarto's default "Figure 1:". A captioned image with NO `#fig-` label renders
# its caption unnumbered — which is what the page heroes rely on.
crossref:
  title-delim: ":"
