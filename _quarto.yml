project:
  type: website
  output-dir: _site
  # Render everything except the blog (kept in the repo, not published for now).
  # To bring the blog back, remove these render rules.
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!blog/**"

website:
  title: "Laura Burnett"
  description: "Research data scientist working across neuroscience, data pipelines and open research resources."
  # Required for absolute og:image / canonical URLs — social scrapers reject
  # relative image paths, so link previews stay blank without this.
  site-url: "https://leburnett.github.io"
  search: false

  # Default social preview image for every page. Pages that set their own
  # `image:` in frontmatter (e.g. project cards) override this automatically.
  image: "/assets/social-card.png"

  sidebar:
    style: docked
    background: transparent
    contents:
      - text: "Projects"
        href: projects/index.qmd
      - text: "CV"
        href: experience.qmd
      - text: "About Me"
        href: about.qmd
      - text: "---"
      - icon: github
        text: "GitHub"
        href: https://github.com/leburnett
      - icon: mortarboard-fill
        text: "Scholar"
        href: https://scholar.google.com/citations?user=oPPRKuIAAAAJ&hl=en&oi=ao
      - icon: linkedin
        text: "LinkedIn"
        href: https://www.linkedin.com/in/laura-burnett-265a16247/
      - icon: envelope
        text: "Email"
        href: mailto:leburnett3@gmail.com
      - icon: file-earmark-arrow-down
        text: "Download CV"
        href: assets/cv.pdf
        target: "_blank"

  open-graph: true
  twitter-card: true

format:
  html:
    theme:
      dark: [darkly, custom-dark.scss]
      light: [journal, custom.scss]
    # Off by default. The longer project pages switch it on with `toc: true` in
    # their own frontmatter; these two settings sit here so the placement and
    # heading stay consistent wherever it is enabled.
    toc: false
    toc-location: right
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    # _project-nav.html is generated by scripts/build-project-nav.py — rerun it
    # after adding a project or changing a `priority`.
    include-after-body:
      - _tooltips.html
      - _project-nav.html
    # Click any figure to open it full-size.
    lightbox: auto

# Figure numbers come from `#fig-` labels rather than being typed into the
# caption text. `title-delim` keeps the existing "Figure 1." style rather than
# Quarto's default "Figure 1:". A captioned image with NO `#fig-` label renders
# its caption unnumbered — which is what the page heroes rely on.
crossref:
  title-delim: ":"
